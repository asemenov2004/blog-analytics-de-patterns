line-length = 120
target-version = "py311"
extend-exclude = ["reports/lib/meta.py"]

[lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]  # zip без strict — осознанно, длины совпадают по построению

[lint.isort]
known-first-party = ["blogsim", "docx_report", "meta", "common", "lab_common"]
